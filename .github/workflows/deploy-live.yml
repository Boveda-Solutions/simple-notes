# Release pipeline: the only path to the live app and live database.
# Lovable works on `dev` against the test database; `main` is protected and
# only changes through a reviewed pull request. On merge, this job applies
# database migrations to LIVE, points the build at LIVE, and deploys.
name: Deploy live

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations to live
        if: hashFiles('supabase/migrations/*.sql') != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.LIVE_DB_PASSWORD }}
          LIVE_REF: ${{ vars.LIVE_SUPABASE_PROJECT_REF }}
        run: |
          # Lovable's config.toml names the TEST project; retarget it for this job only.
          sed -i -E "s/^project_id = .*/project_id = \"${LIVE_REF}\"/" supabase/config.toml
          supabase link --project-ref "$LIVE_REF"
          supabase db push --linked --dry-run 2>&1 | tee /tmp/dry.txt
          if ! grep -q "Target: .*${LIVE_REF}" /tmp/dry.txt; then
            echo "::error::Migration target is not the live project; refusing to push"; exit 1
          fi
          supabase db push --linked

      # Lovable hard-codes the TEST database in this generated file.
      # Swap in LIVE for this build only; nothing is committed.
      - name: Point the build at the live database
        env:
          LIVE_URL: ${{ vars.LIVE_SUPABASE_URL }}
          LIVE_KEY: ${{ vars.LIVE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          f=src/integrations/supabase/client.ts
          sed -i -E \
            -e "s|^const SUPABASE_URL = .*|const SUPABASE_URL = \"${LIVE_URL}\";|" \
            -e "s|^const SUPABASE_PUBLISHABLE_KEY = .*|const SUPABASE_PUBLISHABLE_KEY = \"${LIVE_KEY}\";|" \
            "$f"
          grep -q "${LIVE_URL}" "$f"
          test_ref=$(git show HEAD:supabase/config.toml | sed -n 's/^project_id = "\(.*\)"/\1/p')
          if grep -rq "$test_ref" src; then
            echo "::error::Test database reference still present in src/ after swap"; exit 1
          fi

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Refuse to ship anything that references the test database
        run: |
          test_ref=$(git show HEAD:supabase/config.toml | sed -n 's/^project_id = "\(.*\)"/\1/p')
          if grep -rq "$test_ref" .output; then
            echo "::error::Build output references the test database ($test_ref)"; exit 1
          fi

      # Server code reads SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY at runtime.
      # Lovable injects TEST values in its own hosting; here we set LIVE ones.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_URL: ${{ vars.LIVE_SUPABASE_URL }}
          LIVE_KEY: ${{ vars.LIVE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npx -y wrangler@4 deploy \
            --var "SUPABASE_URL:${LIVE_URL}" \
            --var "SUPABASE_PUBLISHABLE_KEY:${LIVE_KEY}" \
            --var "VITE_SUPABASE_URL:${LIVE_URL}" \
            --var "VITE_SUPABASE_PUBLISHABLE_KEY:${LIVE_KEY}"
